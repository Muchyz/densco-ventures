<!DOCTYPE html>
<html lang="en">
  <head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Densco Ventures Limited | Your Trusted Security Partner</title>
    <meta name="description" content="DENSCO VENTURES LIMITED — professional guarding, CCTV, alarm systems, access control, private investigations and events security in Nairobi & Embu, Kenya." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <script>
window.addEventListener('load', function() {
  setTimeout(function() {
    var card = document.querySelector('.contact-form-card');
    if (card) {
      var rect = card.getBoundingClientRect();
      alert('card left: ' + rect.left + ' / card right: ' + rect.right + ' / viewport width: ' + window.innerWidth + ' / right gap: ' + (window.innerWidth - rect.right));
    } else {
      alert('contact-form-card not found');
    }
  }, 500);
});
</script>
<script>
window.addEventListener('load', function() {
  setTimeout(function() {
    var card = document.querySelector('.contact-form-card');
    var grid = document.querySelector('.contact-grid');
    var container = document.querySelector('.contact-section .container');
    var msgs = [];
    [['card', card], ['grid', grid], ['container', container]].forEach(function(pair) {
      var el = pair[1];
      if (el) {
        var r = el.getBoundingClientRect();
        msgs.push(pair[0] + ': left=' + r.left.toFixed(1) + ' right=' + r.right.toFixed(1) + ' width=' + r.width.toFixed(1));
      } else {
        msgs.push(pair[0] + ': not found');
      }
    });
    alert(msgs.join('\n'));
  }, 500);
});
</script>
</body>
</html>
